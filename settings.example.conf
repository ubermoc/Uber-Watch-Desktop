# Copy to ~/.config/systemd/user/strata-watchdog.service.d/10-settings.conf and edit.
[Service]
# The Strata preset to keep loaded, the model name the server reports, and its address:
Environment=STRATA_PRESET=my-preset
Environment=STRATA_MODEL=my-model-name
Environment=STRATA_URL=http://127.0.0.1:8081
# Optional: other user services to keep up, space separated (they are started if stopped):
# Environment=UBER_WATCH_UNITS="service-one service-two"
